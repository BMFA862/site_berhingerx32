<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="plugG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wallBg)"/>

  <!-- Cadre principal -->
  <rect x="40" y="30" width="520" height="340" rx="16" fill="#111827" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>
  <text x="300" y="65" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. ALIMENTATION SECTEUR &amp; PRISE MURALE</text>

  <!-- Prise murale -->
  <g transform="translate(130, 95)">
    <rect x="0" y="0" width="140" height="150" rx="20" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <circle cx="70" cy="75" r="45" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Broches terre & prises -->
    <circle cx="55" cy="75" r="7" fill="#020617"/>
    <circle cx="85" cy="75" r="7" fill="#020617"/>
    <rect x="67" y="42" width="6" height="14" rx="3" fill="#94a3b8"/>
    <text x="70" y="175" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Prise secteur murale</text>
  </g>

  <!-- Flèche de branchement -->
  <g transform="translate(290, 160)">
    <path d="M-15 0 L15 0 M5 -10 L15 0 L5 10" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fiche mâle / Câble -->
  <g transform="translate(330, 100)">
    <rect x="30" y="15" width="80" height="110" rx="14" fill="url(#plugG)" stroke="#64748b" stroke-width="2"/>
    <!-- Broches -->
    <rect x="0" y="40" width="30" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="0" y="80" width="30" height="10" rx="3" fill="#cbd5e1"/>
    <!-- Câble sortant -->
    <path d="M110 70 Q160 70 170 140" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
    <path d="M110 70 Q160 70 170 140" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <text x="70" y="150" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Câble d'alimentation</text>
  </g>

  <!-- Encart d'avertissement -->
  <g transform="translate(70, 275)">
    <rect x="0" y="0" width="460" height="75" rx="10" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="230" y="28" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚠️ ATTENTION PENDANT LA MISE SOUS TENSION</text>
    <text x="230" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Ne surtout pas manipuler les câbles audio ou branchements</text>
    <text x="230" y="66" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">afin d'éviter les bruits violents et les risques d'acouphènes.</text>
  </g>
</svg>
