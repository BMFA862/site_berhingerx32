<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shutBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0b0f17"/>

  <!-- Screen Bezel -->
  <rect x="40" y="30" width="520" height="340" rx="14" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Screen Display -->
  <rect x="60" y="50" width="480" height="300" rx="6" fill="url(#shutBg)" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Screen Header -->
  <rect x="60" y="50" width="480" height="36" fill="#1a141b"/>
  <text x="80" y="74" fill="#f87171" font-family="monospace" font-size="14" font-weight="bold">SETUP &gt; GLOBAL &gt; SHUTDOWN</text>

  <!-- Big Central Confirmation Modal on screen -->
  <rect x="110" y="110" width="380" height="180" rx="8" fill="#1e1823" stroke="#ef4444" stroke-width="2" filter="drop-shadow(0 0 16px rgba(239,68,68,0.3))"/>
  
  <circle cx="300" cy="145" r="22" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="2"/>
  <path d="M300 135 L300 148 M300 155 L300 157" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <text x="300" y="190" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SAFE TO POWER OFF CONSOLE</text>
  <text x="300" y="212" fill="#cbd5e1" font-family="sans-serif" font-size="13" text-anchor="middle">Les paramètres et scènes ont été sécurisés.</text>
  <text x="300" y="232" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Vous pouvez maintenant basculer l'interrupteur arrière.</text>

  <!-- Shutdown encoder button -->
  <rect x="230" y="250" width="140" height="28" rx="6" fill="#ef4444"/>
  <text x="300" y="269" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SHUTDOWN READY</text>
</svg>
