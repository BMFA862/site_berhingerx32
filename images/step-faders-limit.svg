<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="faderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="redZone" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0b0f17"/>

  <rect x="30" y="25" width="540" height="350" rx="14" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="300" y="55" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">RÉGLAGE DES VOLUMES (FADERS) &amp; LIMITE 0 dB</text>

  <!-- Fader Sortie (Master / Bus) -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="160" height="210" rx="8" fill="#182234" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. RÉGLER LA SORTIE</text>
    <text x="80" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">(Bus Retour / Master)</text>

    <!-- Échelle graduée -->
    <rect x="30" y="55" width="6" height="135" rx="3" fill="#020617"/>
    <!-- Zone rouge au dessus de 0 -->
    <rect x="30" y="55" width="6" height="30" rx="3" fill="#ef4444"/>
    <text x="20" y="65" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">+10</text>
    <!-- Ligne repère 0 dB -->
    <line x1="22" y1="85" x2="68" y2="85" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="20" y="89" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">0 dB</text>
    <text x="20" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="end">-10</text>
    <text x="20" y="185" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="end">-∞</text>

    <!-- Fader cap au niveau nominal 0 dB ou -5 dB -->
    <rect x="42" y="78" width="40" height="24" rx="4" fill="url(#faderGrad)" stroke="#cbd5e1"/>
    <line x1="42" y1="90" x2="82" y2="90" stroke="#f59e0b" stroke-width="2"/>
    <text x="95" y="94" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Max 0 dB</text>
  </g>

  <!-- Fader Entrée Instrument -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="180" height="210" rx="8" fill="#182234" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="90" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. RÉGLER CHAQUE INSTRUMENT</text>
    <text x="90" y="38" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">(Guitare, Piano, Micros...)</text>

    <!-- Slot & Fader -->
    <rect x="35" y="55" width="6" height="135" rx="3" fill="#020617"/>
    <line x1="28" y1="85" x2="68" y2="85" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="26" y="89" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end">0</text>
    
    <!-- Fader cap ajusté à -5dB -->
    <rect x="45" y="98" width="36" height="22" rx="4" fill="url(#faderGrad)" stroke="#38bdf8"/>
    <line x1="45" y1="109" x2="81" y2="109" stroke="#ffffff" stroke-width="2"/>
    <text x="92" y="112" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Ajustement fin</text>
    <text x="92" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10">selon le besoin</text>
  </g>

  <!-- Avertissement casse enceintes -->
  <g transform="translate(50, 305)">
    <rect x="0" y="0" width="500" height="55" rx="8" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="250" y="24" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ INTERDICTION DE DÉPASSER LE NIVEAU 0 dB</text>
    <text x="250" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Le passage dans la zone rouge provoque de la distorsion et risque de détruire les enceintes.</text>
  </g>
</svg>
