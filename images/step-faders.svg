<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0b0f17"/>
  
  <rect x="40" y="30" width="520" height="340" rx="12" fill="#131b2a" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="300" y="65" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SECTION FADERS &amp; 48V CHECK</text>

  <!-- 4 Faders Strip Representation -->
  <!-- Fader 1 -->
  <g transform="translate(90, 85)">
    <!-- Scribble Strip LCD -->
    <rect x="0" y="0" width="80" height="35" rx="4" fill="#0284c7" stroke="#38bdf8"/>
    <text x="40" y="22" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CH 01-VOC</text>
    <!-- Mute Button -->
    <rect x="15" y="45" width="50" height="26" rx="4" fill="#ef4444" stroke="#f87171"/>
    <text x="40" y="63" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MUTE</text>
    <!-- Slot Track -->
    <rect x="36" y="85" width="8" height="150" rx="4" fill="#000000"/>
    <!-- Fader Cap at Bottom (0 / Inf) -->
    <rect x="20" y="205" width="40" height="30" rx="4" fill="url(#metal)" stroke="#94a3b8"/>
    <rect x="22" y="218" width="36" height="3" fill="#ffffff"/>
    <text x="40" y="255" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">-∞</text>
  </g>

  <!-- Fader 2 -->
  <g transform="translate(200, 85)">
    <!-- Scribble Strip LCD -->
    <rect x="0" y="0" width="80" height="35" rx="4" fill="#0284c7" stroke="#38bdf8"/>
    <text x="40" y="22" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CH 02-GTR</text>
    <!-- Mute Button -->
    <rect x="15" y="45" width="50" height="26" rx="4" fill="#ef4444" stroke="#f87171"/>
    <text x="40" y="63" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MUTE</text>
    <!-- Slot Track -->
    <rect x="36" y="85" width="8" height="150" rx="4" fill="#000000"/>
    <!-- Fader Cap at Bottom -->
    <rect x="20" y="205" width="40" height="30" rx="4" fill="url(#metal)" stroke="#94a3b8"/>
    <rect x="22" y="218" width="36" height="3" fill="#ffffff"/>
    <text x="40" y="255" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">-∞</text>
  </g>

  <!-- Fader 3 : MASTER LR -->
  <g transform="translate(320, 85)">
    <!-- Scribble Strip LCD -->
    <rect x="0" y="0" width="80" height="35" rx="4" fill="#dc2626" stroke="#f87171"/>
    <text x="40" y="22" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MAIN L/R</text>
    <!-- Mute Button -->
    <rect x="15" y="45" width="50" height="26" rx="4" fill="#ef4444" stroke="#f87171"/>
    <text x="40" y="63" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MUTE</text>
    <!-- Slot Track -->
    <rect x="36" y="85" width="8" height="150" rx="4" fill="#000000"/>
    <!-- Fader Cap at Bottom -->
    <rect x="20" y="205" width="40" height="30" rx="4" fill="url(#metal)" stroke="#f87171" stroke-width="2"/>
    <rect x="22" y="218" width="36" height="3" fill="#ffffff"/>
    <text x="40" y="255" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">-∞</text>
  </g>

  <!-- 48V Indicator Box -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="105" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="52" y="30" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">+48V CHECK</text>
    <circle cx="52" cy="70" r="18" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="2"/>
    <text x="52" y="75" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">48V</text>
    <text x="52" y="115" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Désactivé sur</text>
    <text x="52" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">entrées ligne !</text>
    <text x="52" y="145" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">STATUT : SÉCURISÉ</text>
  </g>
</svg>
