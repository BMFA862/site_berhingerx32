<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="swG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgP)"/>
  <!-- Console rear panel outline -->
  <rect x="50" y="60" width="500" height="280" rx="16" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="70" y="80" width="460" height="240" rx="10" fill="#182234" stroke="rgba(6,182,212,0.2)"/>
  
  <!-- Ventilation grille -->
  <g fill="rgba(255,255,255,0.06)">
    <rect x="90" y="100" width="160" height="6" rx="3"/>
    <rect x="90" y="115" width="160" height="6" rx="3"/>
    <rect x="90" y="130" width="160" height="6" rx="3"/>
    <rect x="90" y="145" width="160" height="6" rx="3"/>
  </g>

  <!-- Power Switch unit -->
  <rect x="360" y="130" width="130" height="150" rx="12" fill="url(#swG)" stroke="#334155" stroke-width="3"/>
  <rect x="390" y="155" width="70" height="100" rx="6" fill="#090d16" stroke="#475569" stroke-width="2"/>
  
  <!-- Switch Rocker ON position -->
  <polygon points="395,160 455,160 450,210 400,210" fill="#10b981" filter="drop-shadow(0 0 8px rgba(16,185,129,0.8))"/>
  <text x="425" y="190" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">I</text>
  <polygon points="400,210 450,210 455,250 395,250" fill="#1e293b"/>
  <text x="425" y="235" fill="#64748b" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">O</text>
  
  <!-- Label -->
  <text x="425" y="275" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">POWER SWITCH</text>
  <rect x="360" y="295" width="130" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="425" y="311" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">ÉTAPE : ALLUMER (ON)</text>

  <!-- IEC Power Plug symbol -->
  <rect x="100" y="190" width="90" height="80" rx="8" fill="#0b0f17" stroke="#334155" stroke-width="2"/>
  <rect x="135" y="205" width="20" height="10" rx="2" fill="#475569"/>
  <rect x="120" y="235" width="10" height="20" rx="2" fill="#475569"/>
  <rect x="160" y="235" width="10" height="20" rx="2" fill="#475569"/>
  <text x="145" y="290" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">100-240V ~ 50/60Hz</text>
</svg>
