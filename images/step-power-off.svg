<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="offBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#offBg)"/>

  <rect x="30" y="25" width="540" height="350" rx="14" fill="#111827" stroke="rgba(239,68,68,0.3)" stroke-width="2"/>
  <text x="300" y="55" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">3. HORS TENSION : INTERRUPTEUR ARRIÈRE &amp; MULTIPRISE</text>

  <!-- Bloc 1 : Interrupteur arrière sur O -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="220" height="190" rx="10" fill="#182234" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="#334155"/>
    <text x="110" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. BOUTON ARRIÈRE SUR O (OFF)</text>

    <!-- Switch Rocker OFF -->
    <g transform="translate(75, 45)">
      <rect x="0" y="0" width="70" height="100" rx="6" fill="#090d16" stroke="#475569" stroke-width="2"/>
      <!-- I position non enfoncée -->
      <polygon points="5,5 65,5 60,45 10,45" fill="#1e293b"/>
      <text x="35" y="32" fill="#64748b" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">I</text>
      <!-- O position ENFONCÉE -->
      <polygon points="10,45 60,45 65,95 5,95" fill="#ef4444" filter="drop-shadow(0 0 8px rgba(239,68,68,0.8))"/>
      <text x="35" y="78" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">O</text>
    </g>
    <text x="110" y="172" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Console éteinte (Position O)</text>
  </g>

  <!-- Bloc 2 : Débranchement multiprise murale -->
  <g transform="translate(320, 75)">
    <rect x="0" y="0" width="220" height="190" rx="10" fill="#182234" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="#78350f"/>
    <text x="110" y="20" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. DÉBRANCHER LA MULTIPRISE</text>

    <!-- Prise murale & flèche débranchement -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="60" height="60" rx="10" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="30" cy="30" r="18" fill="#1e293b"/>
      <circle cx="24" cy="30" r="3" fill="#ffffff"/>
      <circle cx="36" cy="30" r="3" fill="#ffffff"/>

      <!-- Fiche multiprise retirée -->
      <g transform="translate(75, 10)">
        <rect x="0" y="5" width="40" height="30" rx="6" fill="#475569" stroke="#cbd5e1"/>
        <line x1="-15" y1="14" x2="0" y2="14" stroke="#cbd5e1" stroke-width="3"/>
        <line x1="-15" y1="26" x2="0" y2="26" stroke="#cbd5e1" stroke-width="3"/>
        <path d="M40 20 L65 20" stroke="#000000" stroke-width="6"/>
      </g>
      <!-- Flèche débranchement -->
      <path d="M70 20 L55 20 M60 14 L52 20 L60 26" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="110" y="145" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Prise murale uniquement !</text>
    <text x="110" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Ne pas débrancher les câbles console</text>
  </g>

  <!-- Encart d'attention -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="500" height="75" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="250" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ RÈGLE IMPORTANTE SUR LES PRISES</text>
    <text x="250" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">Ne débrancher QUE les blocs multiprises connectés aux prises murales.</text>
    <text x="250" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Ne pas débrancher les cordons d'alimentation directement à l'arrière de la table.</text>
  </g>
</svg>
