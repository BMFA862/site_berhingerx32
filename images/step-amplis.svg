<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0b0f17"/>
  
  <!-- Left Speaker -->
  <g transform="translate(70, 50)">
    <rect x="0" y="0" width="160" height="280" rx="10" fill="url(#speakerGrad)" stroke="#374151" stroke-width="2"/>
    <!-- Tweeter / Horn -->
    <rect x="25" y="25" width="110" height="60" rx="6" fill="#030712" stroke="#4b5563"/>
    <ellipse cx="80" cy="55" rx="35" ry="18" fill="#1f2937"/>
    <!-- Woofer -->
    <circle cx="80" cy="180" r="55" fill="#030712" stroke="#4b5563" stroke-width="2"/>
    <circle cx="80" cy="180" r="25" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="80" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FAÇADE GAUCHE</text>
  </g>

  <!-- Central Amp Rack -->
  <g transform="translate(260, 90)">
    <rect x="0" y="0" width="190" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Amp 1 -->
    <rect x="10" y="15" width="170" height="65" rx="4" fill="#0f172a" stroke="#334155"/>
    <circle cx="35" cy="47" r="10" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
    <text x="55" y="52" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">AMPLI PUISSANCE</text>
    <rect x="145" y="35" width="20" height="25" rx="2" fill="#10b981"/>
    <text x="155" y="51" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ON</text>

    <!-- Amp 2 -->
    <rect x="10" y="95" width="170" height="65" rx="4" fill="#0f172a" stroke="#334155"/>
    <circle cx="35" cy="127" r="10" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
    <text x="55" y="132" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">AMPLI RETOURS</text>
    <rect x="145" y="115" width="20" height="25" rx="2" fill="#10b981"/>
    <text x="155" y="131" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ON</text>

    <!-- Warning / Priority Badge -->
    <rect x="-10" y="200" width="210" height="34" rx="6" fill="rgba(245,158,11,0.15)" stroke="#f59e0b"/>
    <text x="95" y="222" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ ALLUMER EN TOUT DERNIER</text>
  </g>

  <!-- Right Speaker -->
  <g transform="translate(470, 50)">
    <rect x="0" y="0" width="160" height="280" rx="10" fill="url(#speakerGrad)" stroke="#374151" stroke-width="2"/>
    <rect x="25" y="25" width="110" height="60" rx="6" fill="#030712" stroke="#4b5563"/>
    <ellipse cx="80" cy="55" rx="35" ry="18" fill="#1f2937"/>
    <circle cx="80" cy="180" r="55" fill="#030712" stroke="#4b5563" stroke-width="2"/>
    <circle cx="80" cy="180" r="25" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="80" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FAÇADE DROITE</text>
  </g>
</svg>
