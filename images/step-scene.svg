<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1726"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0b0f17"/>
  
  <!-- Screen Bezel -->
  <rect x="40" y="30" width="520" height="340" rx="14" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Screen Display -->
  <rect x="60" y="50" width="480" height="300" rx="6" fill="url(#screenBg)" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Screen Top Bar -->
  <rect x="60" y="50" width="480" height="36" fill="#132238"/>
  <text x="80" y="74" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">SCENES / CUES / SNIPPETS</text>
  <circle cx="480" cy="68" r="6" fill="#10b981"/>
  <text x="500" y="73" fill="#94a3b8" font-family="monospace" font-size="12">AES50: OK</text>

  <!-- Scene List Rows -->
  <g font-family="monospace" font-size="13">
    <!-- Active Scene Row -->
    <rect x="80" y="105" width="440" height="36" rx="4" fill="rgba(6,182,212,0.25)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="95" y="128" fill="#ffffff" font-weight="bold">01 : CONCERT_LIVE_DEFAULT</text>
    <text x="440" y="128" fill="#34d399" font-weight="bold">[ CHARGÉ ]</text>

    <!-- Other Rows -->
    <rect x="80" y="150" width="440" height="32" rx="4" fill="rgba(255,255,255,0.03)"/>
    <text x="95" y="171" fill="#94a3b8">02 : REPETITION_ACOUSTIQUE</text>

    <rect x="80" y="190" width="440" height="32" rx="4" fill="rgba(255,255,255,0.03)"/>
    <text x="95" y="211" fill="#94a3b8">03 : CONFERENCE_DISCOURS</text>

    <rect x="80" y="230" width="440" height="32" rx="4" fill="rgba(255,255,255,0.03)"/>
    <text x="95" y="251" fill="#94a3b8">04 : INITIAL_RESET_ZERO</text>
  </g>

  <!-- Encoder knobs representation -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="80" height="36" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="40" y="23" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GO / LOAD</text>
    
    <rect x="120" y="0" width="80" height="36" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="160" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PREV</text>

    <rect x="220" y="0" width="80" height="36" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="260" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NEXT</text>

    <rect x="320" y="0" width="80" height="36" rx="6" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="360" y="23" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CONFIRM</text>
  </g>
</svg>
