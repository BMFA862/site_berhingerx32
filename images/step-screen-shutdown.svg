<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="scrBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0b0f17"/>

  <!-- Contour écran console -->
  <rect x="30" y="20" width="540" height="360" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <rect x="45" y="35" width="410" height="250" rx="8" fill="url(#scrBg)" stroke="#475569" stroke-width="1.5"/>

  <!-- Barre d'onglets écran -->
  <rect x="45" y="35" width="410" height="35" fill="#1e293b"/>
  <!-- Onglet ② GLOBAL -->
  <rect x="55" y="40" width="90" height="26" rx="4" fill="#0284c7" stroke="#38bdf8"/>
  <text x="100" y="57" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GLOBAL</text>
  <!-- Pastille numéro ② -->
  <circle cx="150" cy="40" r="10" fill="#f59e0b"/>
  <text x="150" y="44" fill="#000000" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">②</text>

  <rect x="165" y="40" width="70" height="26" rx="4" fill="#0f172a"/>
  <text x="200" y="57" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">CONFIG</text>
  <rect x="245" y="40" width="60" height="26" rx="4" fill="#0f172a"/>
  <text x="275" y="57" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">NETWORK</text>

  <!-- Contenu écran -->
  <g transform="translate(60, 90)">
    <text x="10" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Console Setup &amp; Initialization</text>
    
    <!-- Option ④ SHUTDOWN -->
    <rect x="230" y="120" width="145" height="55" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="302" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SHUTDOWN</text>
    <text x="302" y="162" fill="#fca5a5" font-family="sans-serif" font-size="10" text-anchor="middle">Press to power off</text>
    <!-- Pastille numéro ④ -->
    <circle cx="230" cy="120" r="11" fill="#f59e0b"/>
    <text x="230" y="124" fill="#000000" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">④</text>
  </g>

  <!-- Commandes physiques à droite de l'écran -->
  <g transform="translate(470, 40)">
    <!-- Touche ① SETUP -->
    <rect x="10" y="5" width="65" height="35" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="42" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SETUP</text>
    <circle cx="10" cy="5" r="11" fill="#f59e0b"/>
    <text x="10" y="9" fill="#000000" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">①</text>

    <!-- Flèches directionnelles ⑤ -->
    <g transform="translate(15, 65)">
      <circle cx="30" cy="30" r="28" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <!-- Flèches -->
      <polygon points="30,10 24,18 36,18" fill="#38bdf8"/>
      <polygon points="30,50 24,42 36,42" fill="#38bdf8"/>
      <polygon points="10,30 18,24 18,36" fill="#38bdf8"/>
      <polygon points="50,30 42,24 42,36" fill="#38bdf8"/>
      <circle cx="5" cy="5" r="11" fill="#f59e0b"/>
      <text x="5" y="9" fill="#000000" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">⑤</text>
    </g>

    <!-- Encodeur rotatif ③ -->
    <g transform="translate(15, 150)">
      <circle cx="30" cy="30" r="24" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="30" cy="30" r="14" fill="#1e293b"/>
      <line x1="30" y1="16" x2="30" y2="8" stroke="#ffffff" stroke-width="3"/>
      <text x="30" y="70" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Tourner / Cliquer</text>
      <circle cx="5" cy="5" r="11" fill="#f59e0b"/>
      <text x="5" y="9" fill="#000000" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">③</text>
    </g>
  </g>

  <!-- Bandeau étapes récapitulatif -->
  <g transform="translate(45, 295)">
    <rect x="0" y="0" width="510" height="70" rx="8" fill="#0f172a" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
    <text x="25" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">① Touche SETUP</text>
    <text x="135" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">➔</text>
    <text x="155" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">⑤ Flèches vers ② GLOBAL</text>
    <text x="330" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">➔</text>
    <text x="350" y="24" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">③ Encodeur vers ④ SHUTDOWN</text>
    <text x="255" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Valider enfin en appuyant (clic) sur le bouton rotatif ③.</text>
  </g>
</svg>
